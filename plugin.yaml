name: cursor-subscription-directsdk
kind: model-provider
version: 0.3.1
manifest_version: 2
description: Cursor Subscription (DirectSDK) — use your Cursor plan's models (Claude, GPT, Gemini, Grok, Composer, Auto) as a Hermes provider through Cursor's official SDK, with Hermes tools as native Cursor custom tools; Hermes owns tools, approvals and compaction
author: Arnav Prabhu
license: MIT
homepage: https://github.com/arnavprabhu/CursorProviderHermes
tags: [model-provider, cursor, subscription, experimental]
requires_hermes: ">=0.22.6"
platforms: [linux, macos]
# The Cursor SDK runs in a sidecar with its own venv (<plugin>/.venv, hash-pinned cursor-sdk).
python_runtime: external
optional_env:
  - CURSOR_API_KEY
